;; ===========================================================================
;; WorkBuddy AI Portable 5.8.4  launcher.ini
;; ===========================================================================
;; 架构：Electron（自研数据目录，非标准 Electron userData）
;;
;; 日志依据：WorkBuddy AI 日志 - 注册表项目.txt / WorkBuddy AI 日志 - 文件和文件夹.txt
;;
;; 【数据重定向原理】
;;   WorkBuddy AI 通过环境变量控制所有数据目录：
;;     WORKBUDDY_CONFIG_DIR        → 配置根目录（含 logs/skills/cache/pending-telemetry 等）
;;     WORKBUDDY_USER_DATA_DIR     → Electron userData（localStorage/Cookies/会话等）
;;     WORKBUDDY_ORIGINAL_USERPROFILE → 回退/迁移用的原始用户目录
;;   应用内部已将 Electron 的 app.setPath('userData'/'sessionData') 及
;;   app.setAppLogsPath() 全部指向上述目录，故三个变量即可覆盖全部用户级写入。
;;
;; 【注册表写入点】
;;   1. URL 协议注册（setAsDefaultProtocolClient）：
;;      HKCU\Software\Classes\workbuddy
;;      HKCU\Software\Classes\buddy-app
;;   2. 开机自启（setLoginItemSettings）：
;;      HKCU\Software\Microsoft\Windows\CurrentVersion\Run\<AppName>
;;   以上均为 HKCU 用户级键，由 [RegistryKeys] 备份恢复 + [RegistryCleanupIfEmpty] 清理。
;;
;; 【系统目录写入点】
;;   1. %LOCALAPPDATA%\LiteSandbox          → 沙箱运行时目录（DirectoriesMove）
;;   2. %LOCALAPPDATA%\CodeBuddyExtension   → 扩展认证共享目录（DirectoriesMove）
;;   3. %LOCALAPPDATA%\@genieworkbuddy-desktop-updater → 更新器目录（已禁用更新，仍兜底清理）
;; ===========================================================================

[Launch]
ProgramExecutable=WorkBuddyAI\WorkBuddyAI.exe
;; ── GPU 崩溃缓解 ──
;; 实测本机 GPU 进程会崩溃（child-process-gone exitCode=-1），并连带 renderer 崩溃
;; → 窗口被销毁 → window-all-closed → 应用自行退出，表现为「跑一会儿就闪退」。
;; 应用自身要累计 3 次 GPU 崩溃后才 app.disableHardwareAcceleration()，这里直接前置为软件渲染。
;; 如需恢复硬件加速（图形性能优先），把下面这一行清空即可。
CommandLineArguments=--disable-gpu --disable-gpu-compositing --disable-direct-composition
WorkingDirectory=%PAL:AppDir%\WorkBuddyAI
RunBefore=
RunAfter=
MinVersion=10.0

DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=true
WaitForProgram=true

[Environment]
;; ── 用户主目录重定向（根治子进程回退到系统 %USERPROFILE%）──
;; 依据 app.asar 反查，应用内所有“默认路径”均由 os.homedir() 派生：
;;   resolveWorkbuddyConfigDir()      → ~/.workbuddy
;;   ensureWorkbuddyCustomUserDataDirEnv() → ~/.workbuddy-ai  (customUserDataDir)
;;   getCodebuddyHomeDir()            → ~/.codebuddy
;;   resolveDefaultConfigDir()        → ~/<dataFolderName>
;; 将 USERPROFILE/HOME 指向便携 Data\home，即可让上述全部兜底路径落入便携目录，
;; 不再依赖逐目录 junction。
USERPROFILE=%PAL:DataDir%\home
HOME=%PAL:DataDir%\home

;; ── 核心数据重定向 ──
WORKBUDDY_CONFIG_DIR=%PAL:DataDir%\workbuddy
WORKBUDDY_USER_DATA_DIR=%PAL:DataDir%\workbuddy\app
CODEBUDDY_CONFIG_DIR=%PAL:DataDir%\workbuddy
WORKBUDDY_ORIGINAL_USERPROFILE=%PAL:DataDir%
WORKBUDDY_INSTALL_DIR=%PAL:AppDir%\WorkBuddyAI
WORKBUDDY_APP_PATH=%PAL:AppDir%\WorkBuddyAI
WORKBUDDY_RESOURCES_PATH=%PAL:AppDir%\WorkBuddyAI\resources
WORKBUDDY_MAIN_EXE_PATH=%PAL:AppDir%\WorkBuddyAI\WorkBuddyAI.exe

;; ── 阻断自动更新 ──
;; 应用逻辑（app.asar）：
;;   buildUpdateFeedUrl() → process.env.WORKBUDDY_UPDATE_URL
;;                          || updateBaseUrlProvider.getUpdateBaseUrl()
;;                          || 'https://copilot.tencent.com'
;; 注意：设为“空字符串”会被判为 falsy 而回退到默认服务器（实测仍返回 HTTP 204）。
;; 故指向本机不可达端口，使更新源校验立即失败，彻底阻断更新包下载与安装。
WORKBUDDY_UPDATE_URL=http://127.0.0.1:9

;; ── 临时目录重定向 ──
TEMP=%PAL:DataDir%\temp
TMP=%PAL:DataDir%\temp

;; ── 多实例隔离 ──
;; 强制不使用实例号后缀，确保便携版始终使用同一套数据目录。
WORKBUDDY_FORCE_NO_INSTANCE_NUMBER=1

[Activate]
Registry=true
RegistryKeys=true

[RegistryKeys]
;; URL 协议关联（workbuddy://  buddy-app://）
workbuddy_proto=HKCU\Software\Classes\workbuddy
buddyapp_proto=HKCU\Software\Classes\buddy-app

[RegistryCleanupIfEmpty]
;; 清理协议关联键
1=HKCU\Software\Classes\workbuddy
2=HKCU\Software\Classes\buddy-app

[DirectoriesMove]
;; 沙箱目录：运行时创建于 %LOCALAPPDATA%\LiteSandbox
LiteSandbox=%LOCALAPPDATA%\LiteSandbox
;; 扩展认证共享目录
CodeBuddyExtension=%LOCALAPPDATA%\CodeBuddyExtension
;; 更新器目录（禁用更新后理论上不会创建，兜底处理）
genieworkbuddy_updater=%LOCALAPPDATA%\@genieworkbuddy-desktop-updater

[DirectoriesCleanupIfEmpty]
1=%LOCALAPPDATA%\LiteSandbox
2=%LOCALAPPDATA%\CodeBuddyExtension
3=%LOCALAPPDATA%\@genieworkbuddy-desktop-updater

[FileWriteN]
;; 运行前确保数据目录存在
1=MakeDir:%PAL:DataDir%\workbuddy
2=MakeDir:%PAL:DataDir%\workbuddy\app
3=MakeDir:%PAL:DataDir%\temp
4=MakeDir:%PAL:DataDir%\home
